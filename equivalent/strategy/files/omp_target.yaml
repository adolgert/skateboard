name: omp_target
version: 1

# Matching ignores case, so "src/*.f90" covers src/PESs/N4_UMN_PES_Class.F90
# as well as src/mod_kernel.f90. "*" also matches across "/" (it has no
# directory-boundary meaning here), so a pattern under src/ reaches any depth
# below it -- no "**" needed or supported.
allow_globs:
  - "src/*.f90"
  - "notes/regions/*.yaml"

languages:
  fortran:
    compiler: nvfortran
    # Exactly what services/builder/stages.py PROFILES["omp_target"] passes to
    # nvfortran today. Note this includes mem:managed even though the current
    # agent-runner prompt text says "there is NO managed memory on this rung"
    # -- the flags below are what actually gets compiled; the prompt is wrong.
    flags:
      - "-O2"
      - "-mp=gpu"
      - "-gpu=cc89,mem:managed"
      - "-Minfo=accel"

link_flags: []

required_tools:
  - nvfortran
  - compute-sanitizer

# Same NVCOMPILER_ACC_NOTIFY launch-counting as stdpar_managed (notify: omp).
# mandatory: true -- OMP_TARGET_OFFLOAD=MANDATORY is also set, so a host
# fallback is a runtime error here, unlike stdpar_managed.
device_proof:
  notify: omp
  mandatory: true

sanitizers:
  - memcheck
  - racecheck
  - initcheck

# Which visible cases the sanitizers see. "first" here because a sanitizer run
# is far slower than a plain replay and the visible cases differ only in their
# input data; "all" is the other choice.
sanitize_cases: first

analyzer_command: "python3 tools/regionharness/check_sese.py"

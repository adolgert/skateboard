name: stdpar_managed
version: 1

# Files a region under this strategy may legally submit. A specific region's
# own allow-list must stay within this list; it can only narrow it, never add
# a path outside it.
# Matching ignores case, so "src/*.f90" covers src/PESs/N4_UMN_PES_Class.F90
# as well as src/mod_kernel.f90. "*" also matches across "/" (it has no
# directory-boundary meaning here), so a pattern under src/ reaches any depth
# below it -- no "**" needed or supported.
allow_globs:
  - "src/*.f90"
  - "notes/regions/*.yaml"

languages:
  fortran:
    compiler: nvfortran
    # Exactly what services/builder/stages.py PROFILES["stdpar_managed"] passes to
    # nvfortran today, including mem:managed.
    flags:
      - "-O2"
      - "-stdpar=gpu"
      - "-gpu=cc89,mem:managed"
      - "-Minfo=accel"

# No separate link step today (one nvfortran call compiles and links).
# Reserved for the future manifest-driven multi-language build (D13).
link_flags: []

required_tools:
  - nvfortran
  - compute-sanitizer
  # A code may carry its own module of invariants, and the property check
  # runs it with pytest and Hypothesis inside the builder. Every strategy
  # asks for them, not only the porting ones: which strategy a code with
  # properties is ported under is the region's choice, not the code's.
  - "python:pytest"
  - "python:hypothesis"

# NVCOMPILER_ACC_NOTIFY counts kernel launches in stderr (notify: acc).
# mandatory: false -- a host fallback here is not treated as an error.
device_proof:
  notify: acc
  mandatory: false

sanitizers:
  - memcheck
  - racecheck
  - initcheck

# Which visible cases the sanitizers see. "first" here because a sanitizer run
# is far slower than a plain replay and the visible cases differ only in their
# input data; "all" is the other choice.
sanitize_cases: first

analyzer_command: "python3 -m equivalent.analyzers.check_sese"

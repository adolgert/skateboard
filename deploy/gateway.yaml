# The gateway's own configuration, written in the container's terms: every
# path here is a mount point inside the gateway image, not a host directory.
# up.sh writes a second copy beside the state directory whose paths resolve
# on the host, for the ledger command line to read.
version: 1
paths:
  repo: /repo                 # the gateway's own git clone (baseline + region branches)
  ledger_root: /ledger        # ledger_root/<baseline-commit>/<region-id>/ per region
  working_copy: /working      # read-only mount of the agent's working copy
  datasets_root: /datasets    # visible inputs, per region below
  strategies: /strategies     # directory holding the strategy YAML files
  seed: /seed                 # baseline files, used only if repo is not yet initialized
regions:
  "ch04:step":
    spec_path: notes/regions/ch04-step.sese.yaml
    strategy: stdpar_managed        # -> <strategies>/stdpar_managed.yaml
    visible_dataset: visible        # -> <datasets_root>/visible ; optional

version: 1
name: tsunami
source:
  root: baseline            # the tracked tree that becomes the gateway's baseline
  patterns:                 # files that count as source; sent to the builder
    - "**/*.f90"
    - "**/*.F90"
    - "**/*.f08"
    - "**/*.f03"
    - "**/*.f"
    - "**/*.F"
    - "**/*.for"
    - "**/*.inc"
    - "Makefile"
    - "**/*.mk"
build:
  makefile: Makefile        # relative to the tree root
  targets:
    replay:  {target: replay,  executable: replay}
    timing:  {target: timing,  executable: tsunami}
    capture: {target: capture, executable: gen_reference}
interface:
  module: mod_kernel
  entry: step
  inputs:
    - {name: h, dtype: f32, rank: 1}
    - {name: u, dtype: f32, rank: 1}
  outputs:
    - {name: h, dtype: f32, rank: 1}
    - {name: u, dtype: f32, rank: 1}
datasets:
  visible: {args: ["100", "5000", "25", "0.02"]}
  holdout: {args: ["100", "5000", "60", "0.01"]}
timing:
  args: []                  # the program takes its size from its own source today
  outputs: []               # files the run writes, compared against the baseline's
  budget_s: 300
  env:
    # The pristine kernel returns difference arrays by value, so the CPU
    # baseline allocates temporaries every step; keep the arena so the
    # stencil is timed, not page faults.
    MALLOC_TRIM_THRESHOLD_: "-1"
    MALLOC_MMAP_THRESHOLD_: "1073741824"
tolerances: harness/tolerances.json   # relative to the source tree root
properties: null            # or a path to a pytest module
